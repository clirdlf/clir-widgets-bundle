name: Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality baseline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Verify the baseline gate rejects regressions
        run: composer test
      - name: Lint every project PHP file
        run: find . -path './vendor' -prune -o -path './.git' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check WordPress standards against reviewed baseline
        run: composer check:standards
      - name: Check PHP compatibility against reviewed baseline
        if: '!cancelled()'
        run: composer check:compatibility
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: quality-reports-php-${{ matrix.php }}
          path: build/*-report.json
          if-no-files-found: error

  wordpress:
    name: WordPress 7.1.2 on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd, exif
          tools: wp-cli, composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Build installable plugin with WP-CLI
        run: composer package
      - name: Install exact WordPress target
        run: |
          mkdir -p /tmp/clir-wordpress
          wp core download --version=7.1.2 --path=/tmp/clir-wordpress
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --path=/tmp/clir-wordpress
          wp config set WP_DEBUG true --raw --path=/tmp/clir-wordpress
          wp core install --url=http://localhost --title='CLIR CI' --admin_user=ci --admin_password=local-ci-password --admin_email=ci@example.org --skip-email --path=/tmp/clir-wordpress
      - name: Activate packaged plugin and run integration checks
        env:
          CLIR_TEST_ENV: '1'
        run: |
          wp plugin install "$GITHUB_WORKSPACE/build/clir-widgets-bundle.zip" --activate --path=/tmp/clir-wordpress
          composer test:wordpress -- --path=/tmp/clir-wordpress
      - name: Run controlled browser rendering checks
        env:
          CLIR_TEST_ENV: '1'
          CHROME_BIN: google-chrome
        run: |
          composer test:browser-fixture -- --path=/tmp/clir-wordpress
          composer test:browser
      - name: Convert disposable install to multisite and test network activation
        env:
          CLIR_TEST_ENV: '1'
        run: |
          wp plugin deactivate clir-widgets-bundle --path=/tmp/clir-wordpress
          wp core multisite-convert --title='CLIR CI Network' --path=/tmp/clir-wordpress
          wp plugin activate clir-widgets-bundle --network --path=/tmp/clir-wordpress
          composer test:multisite -- --path=/tmp/clir-wordpress
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: browser-results-php-${{ matrix.php }}
          path: build/browser
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.3'
        with:
          name: clir-widgets-bundle
          path: build/clir-widgets-bundle.zip
          if-no-files-found: error
